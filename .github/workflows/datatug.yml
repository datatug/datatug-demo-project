name: DataTug

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingitdb_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate immutable CodeGrapher snapshots
        run: python3 scripts/test-codegrapher-graphs.py
      - uses: datatug/datatug-action@v0.0.1
