titles:
  en: Population (World Bank)
# Latest World Bank population observation per country, one record per file
# under $records/, keyed by lowercase ISO 3166-1 alpha-2 (the same key as the
# countries record it describes). Generated by cmd/wb-import; Git history of
# this directory is the snapshot's provenance.
record_file:
  name: "{key}.json"
  type: "map[string]any"
  format: json
columns:
  country:
    type: string
    required: true
    foreign_key: countries
  iso3:
    type: string
    required: true
    length: 3
  year:
    type: int
    required: true
    min_value: 1960
  population:
    type: int
    required: true
    min_value: 0
  indicator:
    type: string
    required: true
  source_url:
    type: string
  fetched_at:
    type: datetime
  source_updated:
    type: date
columns_order: [country, iso3, year, population, indicator, source_url, fetched_at, source_updated]
